# ------------------------------------------------------------
# Clash Meta (mihomo) 基础模板
# 项目主页: https://github.com/forecho/proxy-config-templates
#
# 适用客户端: Clash Verge Rev / ClashX Meta / Clash Meta for Android / FlClash 等 mihomo 内核客户端
#
# 使用方法:
#   1. 把 proxy-providers 里 airport 的 url 换成你自己的机场订阅链接 (需要 Clash 格式订阅)
#   2. 个人规则加在 rules 开头，越靠前优先级越高
# ------------------------------------------------------------

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
# 延迟测试只算一次握手时间，数值更真实
unified-delay: true
# 并发 TCP 连接，加快建连
tcp-concurrent: true
# 开启进程匹配，PROCESS-NAME 规则才能生效 (仅桌面端和 Android 有效)
find-process-mode: strict
profile:
  # 重启后记住上次手动选择的节点
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # 这些域名不返回 Fake IP，改善 NTP / STUN / 游戏主机 / 部分 UDP 应用的兼容性
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.localhost"
    - "*.home.arpa"
    - "+.msftncsi.com"
    - "+.msftconnecttest.com"
    - "network-test.debian.org"
    - "detectportal.firefox.com"
    - "captive.apple.com"
    - "resolver1.opendns.com"
    - "+.ipv6.microsoft.com"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "xbox.*.microsoft.com"
    - "+.xboxlive.com"
    - "+.turn.twilio.com"
    - "+.stun.twilio.com"
    - "stun.syncthing.net"
    - "stun.*.*"
    - "stun.*.*.*"
    - "controlplane.tailscale.com"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"
    - "ntp.*.com"
    - "+.time.edu.cn"
    - "+.ntp.org.cn"
    - "+.pool.ntp.org"
    - "time1.cloud.tencent.com"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "localhost.work.weixin.qq.com"
    - "+.battlenet.com.cn"
    - "+.blzstatic.cn"
    - "+.battlenet.com"
  # 国内 DNS 即可: 走代理的域名由远端节点解析，不会被污染影响
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 解析机场节点域名用的 DNS
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

# ===== 机场订阅 (把下面的 url 换成你自己的) =====
proxy-providers:
  airport:
    type: http
    url: "https://example.com/YOUR_SUBSCRIPTION_URL"
    interval: 86400
    path: ./providers/airport.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  # ===== 总出口 =====
  - name: 🟢 Proxy
    type: select
    proxies:
      - ♻️ 自动选择
      - 🇭🇰 香港
      - 🇺🇸 美国
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇰🇷 韩国
      - 🇨🇳 台湾
      - 🚀 直接连接

  # ===== 自动选择 / 地区分组 =====
  # 用正则从机场节点里筛出对应地区，自动选延迟最低的
  - name: ♻️ 自动选择
    type: url-test
    use: [airport]
    filter: "HongKong|HK|香港|🇭🇰|US|America|美|🇺🇸|JP|Japan|日本|🇯🇵|Singapore|SG|新加坡|🇸🇬|Korea|KR|韩国|🇰🇷|TW|Taiwan|台湾|🇨🇳|🇹🇼"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🇭🇰 香港
    type: url-test
    use: [airport]
    filter: "HongKong|HK|香港|🇭🇰"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🇺🇸 美国
    type: url-test
    use: [airport]
    filter: "US|America|美|🇺🇸"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🇯🇵 日本
    type: url-test
    use: [airport]
    filter: "JP|Japan|日本|🇯🇵"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🇸🇬 新加坡
    type: url-test
    use: [airport]
    filter: "Singapore|SG|新加坡|🇸🇬"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🇰🇷 韩国
    type: url-test
    use: [airport]
    filter: "Korea|KR|韩国|🇰🇷"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🇨🇳 台湾
    type: url-test
    use: [airport]
    filter: "TW|Taiwan|台湾|🇨🇳|🇹🇼"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # ===== 业务分组 =====
  - name: ⛔️ 广告拦截
    type: select
    proxies:
      - REJECT
      - 🚀 直接连接
  - name: 🌍 国外媒体
    type: select
    proxies:
      - 🟢 Proxy
      - 🇺🇸 美国
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 🇰🇷 韩国
      - 🇨🇳 台湾
  - name: 📺 谷歌服务
    type: select
    proxies:
      - 🇰🇷 韩国
      - 🇨🇳 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 🇺🇸 美国
      - 🟢 Proxy
  - name: Ⓜ️ 微软服务
    type: select
    proxies:
      - 🟢 Proxy
      - 🚀 直接连接
      - 🇺🇸 美国
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 🇰🇷 韩国
      - 🇨🇳 台湾
  - name: 🤖 AIGC
    type: select
    proxies:
      - 🇸🇬 新加坡
      - 🟢 Proxy
      - 🇺🇸 美国
      - 🇯🇵 日本
      - 🇭🇰 香港
      - 🇰🇷 韩国
      - 🇨🇳 台湾
  - name: 📲 电报信息
    type: select
    proxies:
      - 🟢 Proxy
      - 🇺🇸 美国
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 🇰🇷 韩国
      - 🇨🇳 台湾
  - name: 🍎 苹果服务
    type: select
    proxies:
      - 🚀 直接连接
      - 🟢 Proxy
      - 🇺🇸 美国
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 🇰🇷 韩国
      - 🇨🇳 台湾
  - name: 🚀 直接连接
    type: select
    proxies:
      - DIRECT
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🟢 Proxy
      - 🚀 直接连接

