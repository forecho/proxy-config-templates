RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Microsoft/Microsoft.list,Ⓜ️ 微软服务

# 国外流媒体
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/GlobalMedia/GlobalMedia.list,🌍 国外媒体
DOMAIN-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/GlobalMedia/GlobalMedia_Domain.list,🌍 国外媒体
# Telegram
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Telegram/Telegram.list,📲 电报信息
# AI 服务 (OpenAI / Claude / Gemini / Copilot)
